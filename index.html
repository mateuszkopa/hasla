<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Haseł</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }
        h1 {
            color: #007bff;
            margin-bottom: 25px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .multi-generate-option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        input[type="number"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 60px;
            text-align: center;
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-section {
            margin-top: 20px;
            width: 100%;
        }
        #wynik-single {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
            text-align: center;
            padding: 15px;
            border: 2px dashed #28a745;
            border-radius: 8px;
            word-wrap: break-word;
            cursor: copy;
            transition: background-color 0.3s ease;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px; /* Dodano mały margines pod div-em */
        }
        #wynik-single:hover {
            background-color: #e6ffe6;
        }

        #wynik-multiple {
            width: calc(100% - 20px);
            height: 200px;
            padding: 10px;
            border: 2px dashed #28a745;
            border-radius: 8px;
            font-family: monospace;
            font-size: 16px;
            color: #333;
            resize: vertical;
            box-sizing: border-box;
            display: none;
        }
        #wynik-multiple.active {
            display: block;
        }
        .info-text {
            font-size: 16px;
            color: #666;
            margin-top: 15px;
        }
        #copy-info-single { /* Styl dla komunikatu o kopiowaniu */
            font-size: 14px;
            color: #007bff;
            margin-top: 5px;
            display: none; /* Domyślnie ukryty */
        }
        .mklogo {
            width: 7%;
        }

        .footer {
            position: fixed; /* Stopka będzie zawsze widoczna na dole */
            bottom: 0; /* Przykleja stopkę do dolnej krawędzi okna przeglądarki */
            width: 100%; /* Rozciąga stopkę na całą szerokość */
            color: black;
            padding: 15px 0; /* Odstęp wewnętrzny góra/dół, 0 po bokach */
            text-align: center; /* Wyśrodkowuje zawartość stopki */
            z-index: 1000; /* Upewnia się, że stopka jest na wierzchu innych elementów */
        }

        .footer .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .footer p {
            margin: 5px 0; /* Odstęp między akapitami w stopce */
        }

        .footer a {
            color: #007bff; /* Kolor linków w stopce */
            text-decoration: none; /* Usuwa podkreślenie linków */
        }

        .footer a:hover {
            text-decoration: underline; /* Podkreślenie linków po najechaniu myszką */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Generator Haseł</h1>

        <div class="controls">
            <button id="generujPrzycisk">Generuj Hasło</button>

            <div class="multi-generate-option">
                <input type="checkbox" id="generujWieleCheckbox">
                <label for="generujWieleCheckbox">Generuj wiele</label>
                <input type="number" id="iloscHasel" value="5" min="1" max="100" disabled>
            </div>
        </div>

        <div class="result-section">
            <div id="wynik-single" class="info-text">Kliknij przycisk, aby wygenerować hasło!</div>
            <div id="copy-info-single">Naciśnij, aby skopiować</div> <textarea id="wynik-multiple" readonly></textarea>
        </div>
    </div>
<footer class="footer">
    <div class="content">
        <a href="https://www.linkedin.com/in/kopaszewskimateusz/"><img class="mklogo" src="https://dabrowka.wlkp.pl/images/logo/Mateusz%20Kopaszewski.png" alt="Mateusz Kopaszewski LinkedIn"></a>
        <p>
            Copyright © <a href="https://www.instagram.com/kopaszewskimateusz/">Mateusz Kopaszewski</a>
            <br>
            <a href="https://github.com/mateuszkopa">
                <img src="https://img.shields.io/badge/Follow-mateuszkopa-white?style=social&amp;logo=github" alt="Mateusz Kopaszewski Github">
            </a>
        </p>
    </div>
</footer>
    <script>
        function generujLosowyZwrot() {
            const tablica1 = ["Zielony", "Niebieski", "Czerwony", "Zolty", "Czarny", "Duzy", "Maly", "Szybki", "Wolny", "Cieply", "Goracy", "Ladny", "Brazowy", "Dobry", "Uroczy", "Grzeczny", "Mily", "Spokojny", "Cierpliwy", "Czysty", "Przyjemny", "Drewniany", "Szczesliwy", "Szklany", "Kwadratowy", "Okragly", "Bialy", "Kolorowy", "Bursztynowy", "Czekoladowy", "Kremowy", "Limonkowy", "Bezowy"];
            const tablica2 = ["Stol", "Samochód", "Telefon", "Komputer", "Kwiat", "Dom", "Dlugopis", "Laptop", "Zolw", "Okon", "Papier", "Hamak", "Mlynek", "Cedzak", "Pakiet", "Regal", "Lozko", "Garnek", "Zachod", "Mak", "Woz", "Zolw", "Ogien", "Szum", "Row", "Kalkulator", "Slup", "Samochodzik", "Wodnik", "Pancernik", "Wodnik"];
            const znakiSpecjalne = "!@#$%^&*()_+{}[]<>?=+";

            const element1 = tablica1[Math.floor(Math.random() * tablica1.length)];
            const element2 = tablica2[Math.floor(Math.random() * tablica2.length)];

            let cyfry = "";
            for (let i = 0; i < 3; i++) {
                cyfry += Math.floor(Math.random() * 10);
            }

            const znakSpecjalny = znakiSpecjalne[Math.floor(Math.random() * znakiSpecjalne.length)];

            return `${element1}${element2}${cyfry}${znakSpecjalny}`;
        }

        const generujPrzycisk = document.getElementById('generujPrzycisk');
        const generujWieleCheckbox = document.getElementById('generujWieleCheckbox');
        const iloscHaselInput = document.getElementById('iloscHasel');
        const wynikSingleDiv = document.getElementById('wynik-single');
        const wynikMultipleTextarea = document.getElementById('wynik-multiple');
        const copyInfoSingle = document.getElementById('copy-info-single'); // Nowy element

        async function kopiujDoSchowka(text) {
            try {
                await navigator.clipboard.writeText(text);
                console.log('Skopiowano do schowka:', text);
            } catch (err) {
                console.error('Błąd podczas kopiowania do schowka:', err);
                alert('Nie udało się skopiować hasła do schowka. Spróbuj ponownie lub skopiuj ręcznie.');
            }
        }

        generujPrzycisk.addEventListener('click', () => {
            wynikSingleDiv.style.display = 'none';
            copyInfoSingle.style.display = 'none'; // Ukryj komunikat
            wynikMultipleTextarea.classList.remove('active');

            if (generujWieleCheckbox.checked) {
                const ilosc = parseInt(iloscHaselInput.value);
                if (isNaN(ilosc) || ilosc < 1 || ilosc > 100) {
                    wynikMultipleTextarea.classList.add('active');
                    wynikMultipleTextarea.value = 'Wprowadź poprawną liczbę haseł (1-100).';
                    return;
                }

                let generatedPasswords = [];
                for (let i = 0; i < ilosc; i++) {
                    generatedPasswords.push(generujLosowyZwrot());
                }
                wynikMultipleTextarea.value = generatedPasswords.join('\n');
                wynikMultipleTextarea.classList.add('active');
            } else {
                const noweHaslo = generujLosowyZwrot();
                wynikSingleDiv.textContent = noweHaslo;
                wynikSingleDiv.classList.remove('info-text');
                wynikSingleDiv.style.display = 'flex';
                copyInfoSingle.style.display = 'block'; // Pokaż komunikat po wygenerowaniu
            }
        });

        generujWieleCheckbox.addEventListener('change', () => {
            iloscHaselInput.disabled = !generujWieleCheckbox.checked;
            if (generujWieleCheckbox.checked) {
                wynikSingleDiv.style.display = 'none';
                copyInfoSingle.style.display = 'none'; // Ukryj komunikat
                wynikMultipleTextarea.value = '';
                wynikMultipleTextarea.classList.add('active');
            } else {
                wynikSingleDiv.style.display = 'flex';
                wynikSingleDiv.textContent = 'Kliknij przycisk, aby wygenerować hasło!';
                wynikSingleDiv.classList.add('info-text');
                wynikMultipleTextarea.classList.remove('active');
                wynikMultipleTextarea.value = '';
                copyInfoSingle.style.display = 'none'; // Upewnij się, że komunikat jest ukryty na początku
            }
        });

        wynikSingleDiv.addEventListener('click', async () => {
            if (wynikSingleDiv.textContent !== 'Kliknij przycisk, aby wygenerować hasło!' && wynikSingleDiv.textContent !== '') {
                await kopiujDoSchowka(wynikSingleDiv.textContent);
            } else {
                alert('Najpierw wygeneruj hasło, a następnie kliknij, aby je skopiować!');
            }
        });

        wynikMultipleTextarea.addEventListener('focus', (event) => {
            event.target.select();
        });
    </script>

</body>
</html>
